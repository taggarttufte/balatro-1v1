# Makes mp/agent the pytest rootdir for any invocation that targets a path under it, so
# mp/agent/conftest.py always loads and both the agent packages (mcts/, train/) and the
# FORK engine (mp/engine/balatro_sim) are importable regardless of the working directory.
# Order matters: "." first so mcts/train resolve here, "../engine" second so balatro_sim
# resolves to the fork and never to the repo-root BRL package that cwd would otherwise win.
[pytest]
pythonpath = . ../engine
testpaths = tests
