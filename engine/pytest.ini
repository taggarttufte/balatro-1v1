# Makes mp/engine the pytest rootdir for any invocation that targets a path under it,
# so mp/engine/conftest.py is always loaded and the fork's balatro_sim is importable
# regardless of the working directory (e.g. `python -m pytest mp/engine/tests` from the
# repo root, or `pytest` from inside mp/engine).
[pytest]
pythonpath = .
testpaths = tests
